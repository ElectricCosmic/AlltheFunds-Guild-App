<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2d31;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 20px;
        }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #1e1f22;
            border: 1px solid #383a40;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 90px; }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #4752c4; }
        #success-msg {
            display: none;
            color: #23a55a;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Guild Application</h2>
    <form id="appForm">
        <label for="discordTag">Exact Discord Username</label>
        <input type="text" id="discordTag" required placeholder="e.g. username (make sure DMs are open)">

        <label for="charName">What is your in-game character name?</label>
        <input type="text" id="charName" required placeholder="Character Name">

        <label for="gearScore">What is your current gear score?</label>
        <input type="text" id="gearScore" required placeholder="e.g. 3500+">

        <label for="guildGoals">What are you looking for in a guild?</label>
        <textarea id="guildGoals" required placeholder="Tell us what you expect from us..."></textarea>

        <label for="gamingSchedule">When do you normally game and what time zone are you?</label>
        <input type="text" id="gamingSchedule" required placeholder="e.g. Evenings, EST">

        <label for="contentFocus">What content do you want to do?</label>
        <select id="contentFocus" required>
            <option value="" disabled selected>Select content preference</option>
            <option value="PvP">PvP</option>
            <option value="PvE">PvE</option>
            <option value="Casual">Casual</option>
            <option value="PvP / PvE Mix">PvP / PvE Mix</option>
        </select>

        <button type="submit" id="submitBtn">Submit Application</button>
    </form>
    <div id="success-msg">Application submitted successfully!<br><br>Staff will review your stats. If accepted, you will receive a Discord invite link directly.</div>
</div>

<script>
    // Paste your Discord Webhook URL here
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1548795401346482266/Awwc32J0P5any9IRD-4hYGePbY7qXvRS11VvPKxe16rcPA0hFtaYUcSZCyLKbaphTu0S";

    document.getElementById('appForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        const discordTag = document.getElementById('discordTag').value;
        const charName = document.getElementById('charName').value;
        const gearScore = document.getElementById('gearScore').value;
        const guildGoals = document.getElementById('guildGoals').value;
        const gamingSchedule = document.getElementById('gamingSchedule').value;
        const contentFocus = document.getElementById('contentFocus').value;

        const payload = {
            embeds: [{
                title: "📥 New External Application",
                color: 5793266,
                fields: [
                    { name: "Discord User", value: discordTag, inline: true },
                    { name: "Character Name", value: charName, inline: true },
                    { name: "Gear Score", value: gearScore, inline: true },
                    { name: "Content Focus", value: contentFocus, inline: true },
                    { name: "Gaming Schedule / Time Zone", value: gamingSchedule, inline: false },
                    { name: "What they look for in a guild", value: guildGoals, inline: false }
                ],
                timestamp: new Date().toISOString()
            }]
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('appForm').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            } else {
                alert('Failed to submit application. Please try again later.');
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Application";
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred. Check your webhook URL.');
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Application";
        }
    });
</script>

</body>
</html>
